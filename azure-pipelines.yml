trigger:
  branches:
    include:
      - develop
      - release/v*
  tags:
    include:
      - v*

resources:
- repo: self

variables:
  dockerRegistryServiceConnection: 'c04c7d40-1d3c-419a-a814-d1233083cda8'
  imageRepository: 'portal-cidados-web'
  containerRegistry: 'devinspertech.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildNumber)'
  vmImageName: 'ubuntu-latest'

stages:
- stage: Build
  displayName: Build and push stage
  jobs:
  - job: Build
    displayName: Build Docker image and push
    pool:
      vmImage: $(vmImageName)
    steps:

    - task: Docker@2
      displayName: 'Build Docker image'
      inputs:
        command: build
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        buildContext: '$(Build.SourcesDirectory)'
        tags: |
          $(tag)
        arguments: >-
          --build-arg NEXT_PUBLIC_MAPBOX_TOKEN="$(NEXT_PUBLIC_MAPBOX_TOKEN)"

    - task: Docker@2
      displayName: 'Push Docker image'
      inputs:
        command: push
        repository: $(imageRepository)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)
